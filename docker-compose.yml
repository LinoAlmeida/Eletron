services:
  postgres:
    image: postgres:16
    container_name: eletron-postgres
    environment:
      POSTGRES_DB: eletron
      POSTGRES_USER: eletron
      POSTGRES_PASSWORD: eletron_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eletron -d eletron"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
